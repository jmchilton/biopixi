# Adapter only: points pixi-build at the rattler-build recipe beside it. The recipe.yaml is
# the artifact — generated by `rattler-build generate-recipe cran designit`, and the thing
# that eventually becomes a staged-recipes PR.
[package]
name = "r-designit"
version = "0.5.0"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
